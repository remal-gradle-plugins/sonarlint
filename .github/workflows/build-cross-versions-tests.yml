name: 'build: build-cross-versions-tests'

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: ubuntu
        description: Operation system to test against.
      env-json:
        type: string
        required: false
        default: '{}'
        description: Environment variables encoded as JSON.
      versions-matrix-spec:
        type: string
        required: false
        default: ''
        description: Matrix definition for remal-github-actions/matrix-versions action.
      java-gradle-only-once:
        type: boolean
        required: false
        default: true
        description: >-
          Set to `true` to add `only: once` to Java and Gradle dependencies
          for remal-github-actions/matrix-versions action.
      gradle-stable-only:
        type: boolean
        required: false
        default: false
        description: >-
          Test against stable Gradle versions only.
          Future RC versions won't be tested.

defaults:
  run:
    shell: bash

env:
  GITHUB_ACTIONS_TOKEN: ${{github.token}}
  GITHUB_ACTIONS_RUN_ID: ${{github.run_id}}
  GITHUB_ACTIONS_RUN_ATTEMPT: ${{github.run_attempt}}

jobs:
  create-matrix:
    permissions:
      contents: read
      actions: write
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix-includes: ${{steps.matrix-versions.outputs.allMatrixIncludes}}
      max-parallel: ${{steps.max-parallelism.outputs.value || '256'}}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Cancel on newer run
      uses: ./.github/actions/cancel-on-newer-run

    - name: Read min supported Java version
      id: min-java-version
      uses: remal-github-actions/read-property@v1
      with:
        file: gradle.properties
        property: 'java-runtime.min-version'

    - name: Read min supported Gradle version
      id: min-gradle-version
      uses: remal-github-actions/read-property@v1
      with:
        file: gradle.properties
        property: 'gradle-api.min-version'

    - name: Retrieve matrix versions for testing
      id: matrix-versions
      uses: remal-github-actions/matrix-versions@v1
      with:
        matrix: |
          ${{inputs.versions-matrix-spec}}
          java-runtime:
            dependency: java
            only:
            - lts
            - stable
            ${{inputs.java-gradle-only-once && '- once' || ''}}
            include:
            - '[${{steps.min-java-version.outputs.value}},)'
          gradle-api:
            dependency: 'maven:name.remal.gradle-api:gradle-api'
            repositories:
            - 'https://maven.pkg.github.com/remal-gradle-api/packages'
            only:
            - ${{inputs.gradle-stable-only && 'stable-minors' || 'stable-minors+current-unstable'}}
            ${{inputs.java-gradle-only-once && '- once' || ''}}
            include:
            - '[${{steps.min-gradle-version.outputs.value}},)'

    - name: Calculate max parallelism for dependency updates
      id: max-parallelism
      if: ${{github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'dependencies')}}
      env:
        PR_CREATED_AT: ${{github.event.pull_request.created_at}}
        MATRIX_INCLUDES: ${{steps.matrix-versions.outputs.allMatrixIncludes}}
      run: |
        count=$(jq 'length' <<<"${MATRIX_INCLUDES}")
        echo "Matrix size: ${count}"
        echo "PR created at: ${PR_CREATED_AT}"
        created=$(date --date="${PR_CREATED_AT}" +%s)
        days=$(( ($(date +%s) - created) / 86400 ))
        echo "PR age: ${days} days"
        remaining=$(( 256 - days ))
        if [[ "${remaining}" -lt 0 ]]; then
          remaining=0
        fi
        echo "Remaining window: ${remaining}/256"
        max_parallel=$(( count * remaining / 256 ))
        if [[ "${max_parallel}" -lt 1 ]]; then
          max_parallel=1
        fi
        echo "Max parallelism: ${max_parallel}"
        echo "value=${max_parallel}" | tee -a "${GITHUB_OUTPUT}"

  tests:
    needs:
    - create-matrix
    strategy:
      fail-fast: false
      max-parallel: ${{fromJSON(needs.create-matrix.outputs.max-parallel)}}
      matrix:
        include: ${{fromJSON(needs.create-matrix.outputs.matrix-includes)}}
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      os: ${{inputs.os}}
      job-matrix-json: ${{toJSON(matrix)}}
      strategy-job-index: ${{strategy.job-index}}
      strategy-job-total: ${{strategy.job-total}}
      env-json: ${{inputs.env-json}}
